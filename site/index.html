<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f4f">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Treningsdagbok</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2320;--mut:#6b746f;--line:#e2ddd2;--acc:#2f6f4f;--acc2:#b9811a;--bad:#b3402f;--ok:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2320;--ink:#ecefe9;--mut:#9aa59e;--line:#2c3631;--acc:#5fb585;--acc2:#e8b54a;--bad:#e07a68;--ok:#5fb585}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:16px 16px 8px;max-width:760px;margin:auto}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
nav{position:sticky;top:0;background:var(--bg);display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto;z-index:5;max-width:760px;margin:auto}
nav button{flex:1;min-width:max-content;border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:8px;font-size:15px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
main{max-width:760px;margin:auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:70px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:60px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.big{font-size:26px;font-weight:700;line-height:1.2}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px;color:var(--mut)}
.pill.a{background:var(--acc);color:#fff}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.chk input{width:22px;height:22px;flex:none}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.dayrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow.today{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px}
.dot.done{background:var(--ok)}
.note{border:1px dashed var(--acc2);padding:8px 10px;border-radius:8px;color:var(--mut);font-size:13px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
svg{width:100%;height:auto}
.hide{display:none}
.x{color:var(--bad);cursor:pointer;border:0;background:none;font-size:18px}
.ex{padding:8px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
.ex .nm{font-weight:600}
.sm{font-size:13px}
.hl{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.strip{display:flex;gap:4px;margin-bottom:10px}
.sd{flex:1;min-width:0;text-align:center;padding:6px 2px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.sd.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sd.today .sub{color:var(--acc);font-weight:700}
.sd .sl{font-size:10px;line-height:1.15;margin-top:2px;overflow:hidden}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--line);margin:3px auto}
.sdot.done{background:var(--ok)}
.tl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border:0}
.tm{width:46px;flex:none;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.tb{flex:1;min-width:0}
.tl.train{background:color-mix(in srgb,var(--acc) 10%,transparent);margin:0 -14px;padding:9px 14px}
.swap{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--bg)}
details.wk summary{cursor:pointer;list-style:none}
details.wk[open] summary{margin-bottom:6px}
details.hl{border-color:var(--acc)}
.dayrow .pill{align-self:center;white-space:nowrap;flex:none}
.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-start;justify-content:center;overflow-y:auto;padding:12px}
.mbox{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:14px;margin:auto 0}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:18px}
.mbox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 4px}
.mbox ol,.mbox ul{margin:0;padding-left:20px}.mbox li{margin:3px 0}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:6px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;cursor:pointer;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Treningsdagbok</h1>
  <div class="sub" id="topline"></div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
/* =======================================================================
   1. PROGRAM – 28 uker + løpsdag. 11.10.2026 → Madrid halvmaraton søndag 25.04.2027
      Kilder: trening/forskning/01–04. Tall er estimater og kan justeres.
   ======================================================================= */
const START='2026-10-11', RACE='2027-04-25', WEEKS=29; // løpet er søndag i uke 29

const PHASES=[
  {id:1,from:1, to:8, name:'Komme i gang',  days:4, text:'Søn gå/løp, man styrke A, ons styrke B, fre styrke C (armdag). Daglig gange. Bygg vane, ikke form.'},
  {id:2,from:9, to:20,name:'Bygg',          days:5, text:'3 styrke (A, B, C) + 2 løp (kvalitet og langtur). Valgfri rolig økt.'},
  {id:3,from:21,to:25,name:'Topp',          days:5, text:'Lengste langturer, mål-tempo på slutten av langtur.'},
  {id:4,from:26,to:28,name:'Taper',         days:5, text:'Volum ned (–25 / –40 / –60 %), behold litt intensitet.'},
  {id:5,from:29,to:29,name:'Løpsdag',days:0,text:'Madrid, søndag 25. april.'}
];
const phaseOf=w=>PHASES.find(p=>w>=p.from&&w<=p.to)||(w<1?{id:0,name:'Før start',days:0,text:''}:{id:6,name:'Etter løpet',days:0,text:'Fortsett: 3 styrke + 2 kondisjon. Sikt mot 80–83 kg med mer muskel.'});

const E=(n,keys,sc)=>({n,keys,s:sc});
const EX={ // økter: navn, varianter (nøkler i LIB), sett×reps
 A:[E('Knebøy',['goblet','knebokstang','beinpress'],'3×5–8'),E('Benkpress',['benk','manualflat'],'3×6–10'),E('Roing',['kabelroing','manualroing'],'3×8–10'),
    E('Enbens rumensk markløft',['enbensrdl','rdl'],'2×8'),E('Face pull',['facepull'],'2×12–15'),E('Plank / bærertur',['plank','baertur'],'2×30–45 s')],
 B:[E('Rumensk markløft',['rdl'],'3×6–8'),E('Skulderpress',['skulderpress'],'3×6–10'),E('Nedtrekk / pull-ups',['nedtrekk','pullups','strikknedtrekk'],'3×6–10'),
    E('Bulgarsk split squat',['bulgarsk'],'2×8–10'),E('Hamstring curl',['hamcurl'],'2×8–12'),E('Tåhev',['tahev'],'2×12–15')],
 C:[E('Biceps curl',['biceps'],'3×10–12'),E('Hammer curl',['hammer'],'3×10–12'),E('Triceps over hodet',['overhead'],'3×10–12'),
    E('Triceps pushdown',['triceps'],'3×10–12'),E('Sidehev',['sidehev'],'3×12–15'),E('Face pull',['facepull'],'2×15'),
    E('Dead bug / Pallof',['deadbug','pallof'],'2×6–10')],
 R1:[E('Goblet-knebøy / bulgarsk',['goblet','bulgarsk'],'3×10–15'),E('Push-ups (føttene hevet)',['pushupshevet','pushups'],'3× nær failure'),
     E('Enarms roing / TRX-roing',['manualroing','trx'],'3×10–12'),E('Enbens rumensk markløft',['enbensrdl'],'2×10'),E('Plank',['plank'],'2×45 s')],
 R2:[E('Utfall / step-up',['utfall','stepup'],'3×12'),E('Skulderpress',['skulderpress'],'3×10–12'),E('Pull-ups / strikk-nedtrekk',['pullups','strikknedtrekk'],'3×8–12'),
     E('Enbens hip thrust',['enbenship'],'2×12'),E('Sidehev',['sidehev'],'2×15')],
 MIN:[E('Goblet-knebøy / kroppsvekt',['goblet'],'2×12'),E('Push-ups',['pushups'],'2× maks –2'),E('Roing med strikk / TRX',['trx'],'2×12')]
};
const SESS={
 A:{t:'Styrke A',  sub:'Ben-fokus, full kropp',      min:50},
 B:{t:'Styrke B',  sub:'Hengsel og øvre kropp',      min:50},
 C:{t:'Styrke C · Armdag',  sub:'Armdag: biceps, triceps og skuldre. 2–3 sek ned, nær failure kun på siste sett', min:45},
 R1:{t:'Reiseøkt R1',sub:'Hotellgym / kroppsvekt',    min:30},
 R2:{t:'Reiseøkt R2',sub:'Hotellgym / kroppsvekt',    min:30},
 MIN:{t:'Minimumsøkt',sub:'Teller som seier',         min:15}
};
const STRENGTH_RULE='RIR 1–3 (stopp 1–3 reps før failure). Dobbel progresjon: når alle sett treffer øvre rep-grense, øk 2,5 kg. Hvile 2–3 min på tunge løft.';

// Gå/løp uke 1–8 (tirsdagsøkt)
const RUN1={1:'7 × (1 min løp / 2 min gå) ≈ 21 min',2:'8 × (1 min løp / 2 min gå) ≈ 24 min',3:'7 × (2 min løp / 2 min gå) ≈ 28 min',
 4:'5 × (2 / 2) ≈ 20 min – nedlast',5:'7 × (3 min løp / 1 min gå) ≈ 28 min',6:'6 × (4 / 1) ≈ 30 min',7:'5 × (6 / 1) ≈ 35 min',
 8:'25 min rolig jogg, gåpauser ved behov – nedlast'};
// Uke 9–28: [rolig min, kvalitetsøkt, langtur min, langtur-merknad]
const RUN2={
 9:[35,'Fartslek: 6 × 1 min litt raskere / 2 min rolig (~35 min)',60,''],
 10:[35,'Fartslek: 7 × 1 min / 2 min rolig',65,''],
 11:[40,'Fartslek: 8 × 1 min / 2 min rolig',70,''],
 12:[30,'Fartslek: 5 × 1 min – nedlast',50,'Nedlast'],
 13:[40,'Tempo: 2 × 10 min RPE 6–7, 3 min pause',75,''],
 14:[40,'Tempo: 2 × 10 min RPE 6–7',80,''],
 15:[40,'Tempo: 3 × 8 min RPE 6–7',90,''],
 16:[35,'Tempo: 2 × 8 min – nedlast',65,'Nedlast'],
 17:[40,'Tempo: 3 × 10 min RPE 6–7',90,''],
 18:[40,'TEST: 5 km på tid, så godt du kan (varm opp 10 min)',95,''],
 19:[45,'Tempo: 5 × 5 min, 2 min pause',105,''],
 20:[35,'Tempo: 3 × 8 min – nedlast',75,'Nedlast'],
 21:[45,'Tempo: 3 × 10 min',110,''],
 22:[45,'Tempo: 2 × 15 min',120,'Siste 20 min i mål-tempo (6:40–7:00)'],
 23:[45,'Tempo: 3 × 10 min',130,'Siste 20–30 min i mål-tempo – øv geler/drikke'],
 24:[35,'Tempo: 2 × 10 min – nedlast',90,'Nedlast'],
 25:[40,'Tempo: 3 × 8 min',120,'Siste 30 min i mål-tempo'],
 26:[35,'Tempo: 2 × 8 min (taper –25 %)',90,'Taper'],
 27:[30,'Tempo: 4 × 4 min (taper –40 %)',70,'Taper']
};
const W28={ // uke 28 (18.–24.4.), løpet er søndag 25.4. (index = ukedag, 0=søn)
 0:{k:'rolig',t:'Rolig jogg',min:40,d:'40 min rolig. Ingenting nytt.'},
 1:{k:'kval',t:'Lett kvalitet',min:30,d:'25 min rolig + 4 × 1 min i løpstempo. Kort og lett.'},
 2:{k:'styrke',t:'Lett styrke',min:30,d:'Styrke A, halv volum (2 sett), ingen failure.',s:'A'},
 3:{k:'gange',t:'Gange / mobilitet',min:20,d:'20–30 min gange.'},
 4:{k:'rolig',t:'Rolig + stigningsløp',min:20,d:'20 min rolig + 3 × 20 s stigningsløp.'},
 5:{k:'hvile',t:'Hvile / reise til Madrid',min:0,d:'Reisedag: gå litt, drikk vann, normal mat. Pakk løpsutstyr i håndbagasjen.'},
 6:{k:'rolig',t:'Shake-out + startnummer',min:15,d:'15 min veldig rolig + 3 × 20 s stigningsløp. Hent startnummer. Karbo-rik middag, tidlig kveld. Ingenting nytt.'}
};
const RACEDAY={k:'lang',t:'HALVMARATON MADRID 🏁',min:150,d:'Start rolig de første 3 km. 30–60 g karbo/time, drikk etter tørst. Nyt det. Mål 2:15–2:30.'};
const GANGE={k:'gange',t:'Gange / aktiv hvile',min:25,d:'20–30 min rask gange. Valgfritt, men bra for restitusjon og hodet.'};
const HVILE={k:'hvile',t:'Hvile',min:0,d:'Hvil. Sov godt.'};

function planFor(k){
  const w=weekNo(k),dw=dow(k),ph=phaseOf(w);
  if(w<1||w>WEEKS) return {k:'fri',t:'Fri',min:0,d:'',w,ph};
  let p;
  if(w===29) p=dw===0?RACEDAY:{k:'hvile',t:'Restitusjon',min:0,d:'Gå, spis, sov. Ta stolt en pause før neste fase.'};
  else if(w===28) p=W28[dw];
  else if(ph.id===1){
    p=({0:{k:'løp',t:'Gå/løp',min:30,d:'5 min rask gange, deretter '+RUN1[w]+'. Avslutt med 5 min gange. Rolig tempo (RPE 3–4): du skal kunne snakke.'},1:{k:'styrke',s:'A'},3:{k:'styrke',s:'B'},5:{k:'styrke',s:'C'}})[dw]||GANGE;
  } else {
    const r=RUN2[w];
    p=({
      0:{k:'lang',t:'Langtur',min:r[2],d:`${r[2]} min rolig (RPE 3–4, du kan snakke i hele setninger). ${r[3]}`.trim()},
      1:GANGE,
      2:{k:'kval',t:'Kvalitetsløp',min:50,d:r[1]},
      3:{k:'styrke',s:'A'},
      4:{k:'rolig',t:'Valgfri rolig økt',min:r[0],d:`${r[0]} min rolig løp, sykkel eller romaskin. Bare hvis du har overskudd.`,opt:true},
      5:{k:'styrke',s:'B'},
      6:{k:'styrke',s:'C'}
    })[dw]||HVILE;
  }
  p=Object.assign({},p);
  if(p.s){const s=SESS[p.s];p.t=p.t||s.t;p.min=p.min||s.min;p.d=p.d||s.sub}
  if(p.k==='styrke'){
    if(w<=2) p.d+=' · Uke 1–2: bare 2 sett per øvelse, 3–4 reps igjen i tanken. Bygg vane.';
    else if(w>=26&&w<28) p.d+=' · Taper: ~60 % av volumet, samme tyngde.';
  }
  p.w=w;p.ph=ph;return p;
}

/* Kostholdsfaser: underskudd uke 1–12, vedlikehold deretter */
const DEFICIT_TO=12;
function energy(k,plan){
  const w=weekNo(k),def=w<=DEFICIT_TO;
  let lo=def?2300:2700, hi=def?2500:3000;
  if(plan&&plan.k==='lang'){lo+=300;hi+=400}
  return {lo,hi,def};
}
function carbKg(plan){
  const k=plan&&plan.k;
  if(k==='lang') return [5,7];
  if(k==='løp'||k==='rolig'||k==='kval') return [4,5];
  return [3,4];
}
const SUPPS=[
 ['Kreatin monohydrat 3–5 g','hver dag'],
 ['Vitamin D 10–20 µg (okt–mars)','hver dag'],
 ['Omega-3 250–500 mg EPA+DHA','siden du spiser lite fisk']
];
const RULES=[
 'Protein (30–40 g) til hvert hovedmåltid',
 'Grønnsaker/frukt/bær til minst to måltider',
 'Vann hele dagen – minst 2 liter',
 'Alkohol: ingen eller maks 1–2 enheter',
 'Ingen «kaloridrikker» (saft, juice, brus)',
 'Sov 7–9 timer (leggetid planlagt)'
];
const TRAVEL_RULES=[
 'Hotellfrokost: protein først (egg, skyr, ost, kalkun), så havre/grovbrød/frukt. Hopp over wienerbrød og juice.',
 'Restaurant: én proteinrett + grønnsaker + en håndfull poteter/ris/pasta. Saus ved siden av. Én ting «på tilbud»: brød, dessert ELLER alkohol.',
 'Flyplass: ta med pulver, nøtter, skyr eller proteinbar. Kjøp egg, yoghurt, frukt, kyllingwrap.',
 '80/20: En dårlig middag betyr ingenting – mønsteret over uker teller.'
];
const FOODS=[['Egg (2 stk)',12],['Skyr naturell (200 g)',22],['Cottage cheese (150 g)',17],['Kyllingfilet (150 g)',35],
 ['Kjøttdeig 5 % (150 g)',30],['Biff/svin (150 g)',32],['Gresk yoghurt (200 g)',18],['Linser kokt (150 g)',13],
 ['Kikerter (150 g)',11],['Tofu (150 g)',18],['Myseprotein (1 scoop)',22],['Melk (2 dl)',7],['Brød (2 skiver)',8],
 ['Havregryn (50 g)',6],['Nøtter (30 g)',6]];

/* =======================================================================
   ØVELSESBIBLIOTEK: teknikk + animasjon (stilfigur)
   Vinkler: grader fra rett opp, med klokka (0=opp, 90=høyre/fremover, 180=ned).
   ======================================================================= */
const LIB={
goblet:{n:'Goblet-knebøy',g:'Ben',m:'Forside lår, sete, kjerne',u:'1 manual eller kettlebell',
 opp:['Hold manualen loddrett foran brystet med begge hender rundt den ene enden. Albuene peker ned.','Stå med føttene litt bredere enn skuldrene, tærne ut ca. 15–30°.','Bryst opp, blikket rett frem, stram magen.'],
 ut:['Pust inn og spenn magen.','Send hoftene bakover og ned, og la knærne gli utover i samme retning som tærne.','Gå ned til lårene er omtrent parallelle med gulvet (eller så dypt du kontrollerer uten at korsryggen runder seg). Albuene går mellom knærne.','Press hele foten mot gulvet og reis deg. Pust ut på vei opp.'],
 pust:'Inn på vei ned, ut når du har passert det vanskeligste punktet på vei opp.',
 feil:['Knærne faller innover: press dem utover over tærne.','Hælene løfter seg: flytt vekten bakover mot hælene.','Korsryggen runder seg i bunnen: gå mindre dypt eller jobb med ankelmobilitet.','Overkroppen faller fremover: hold manualen tett inn mot brystet.'],
 tips:['2 sekunder ned, 1 sekund opp.','Stopp når du har 1–3 repetisjoner igjen i tanken.'],
 lett:'Knebøy ned til en benk eller stol.',vanskelig:'Tyngre manual, 2 sekunders pause i bunnen, eller knebøy med stang.',hotell:'Perfekt hotellgym-øvelse: én manual er nok.',
 sikker:'Stopp ved smerte i kne eller rygg. Svimmelhet betyr: sett deg ned og pust.'},
knebokstang:{n:'Knebøy med stang',g:'Ben',m:'Forside lår, sete, korsrygg, kjerne',u:'Stang i rack, sikkerhetsstolper',
 opp:['Still stangen i rack i høyde midt på brystet, og sett sikkerhetsstolpene like under bunnposisjonen din.','Gå under stangen og legg den på øvre trapezius (på musklene, ikke på nakkevirvlene). Grip litt bredere enn skuldrene, albuene ned.','Løft ut, ta 2–3 rolige skritt bakover, føtter skulderbredde, tærne ut 15–30°.'],
 ut:['Pust inn, spenn mage og rygg («stiv stamme»).','Send hoftene bakover og ned, knærne følger tærne.','Gå ned til lårene er omtrent parallelle. Stangen skal hele tiden være over midtfoten.','Press gulvet fra deg og reis deg. Pust ut på vei opp.'],
 pust:'Inn og hold før du går ned, ut når du er over det vanskelige punktet.',
 feil:['Knærne faller innover.','Hoftene skyter opp først og overkroppen vipper frem («good morning»).','For dypt med rund korsrygg.','Stangen glir fremover: hold albuene under stangen og trykk bryst opp.'],
 tips:['Bruk sikkerhetsstolper hver gang.','Start med lett stang uke 1–2.'],
 lett:'Goblet-knebøy eller beinpress.',vanskelig:'Pause-knebøy med 2 sekunders stopp i bunn.',hotell:'Krever rack. Bruk goblet-knebøy eller bulgarsk split squat hvis du ikke har det.',
 sikker:'Bruk alltid sikkerhetsstolper eller spotter på tunge sett. Ikke tren til failure med stang.'},
beinpress:{n:'Beinpress',g:'Ben',m:'Forside lår, sete',u:'Beinpressmaskin',
 opp:['Sett deg godt tilbake i setet, hele ryggen og setet mot underlaget.','Plasser føttene på platen omtrent skulderbredde, midt på platen, tærne litt ut.','Grip håndtakene og slipp av sikkerhetsstoppene.'],
 ut:['Pust inn og senk platen kontrollert til knærne er rundt 90° (ikke dypere enn der setet løfter seg).','Press jevnt gjennom hele foten til beina nesten er strake. Ikke lås knærne helt.','Pust ut på vei opp, og senk igjen med kontroll.'],

const CF=['facepull','manualroing','kabelroing','facepull','nedtrekk','strikknedtrekk','pullups','hamcurl','biceps','triceps','trx','hipthrust','enbenship','tahev','sidehev','skulderpress','stepup','pallof'];
function sched(key){return CF.includes(key)?[1.3,.6,2.4,.5]:[2.4,.6,1.3,.5]}
function ease(x){return x*x*(3-2*x)}
function posAt(key,time){
  const T=sched(key),tot=T[0]+T[1]+T[2]+T[3];let x=time%tot;
  if(x<T[0])return {t:ease(x/T[0]),seg:0};x-=T[0];
  if(x<T[1])return {t:1,seg:1};x-=T[1];
  if(x<T[2])return {t:1-ease(x/T[2]),seg:2};
  return {t:0,seg:3};
}
let ANIM={raf:0,key:null,time:0,playing:true,last:0};
function tick(ts){
  const svg=document.getElementById('anim');if(!svg){ANIM.raf=0;return}
  if(!ANIM.last)ANIM.last=ts;
  const dt=(ts-ANIM.last)/1000;ANIM.last=ts;
  const ex=RIG[ANIM.key];
  if(ANIM.playing)ANIM.time+=dt;
  const T=sched(ANIM.key),tot=T[0]+T[1]+T[2]+T[3];
  const p=ex.static?{t:0,seg:1}:posAt(ANIM.key,ANIM.time);
  svg.innerHTML=rigSvg(ANIM.key,p.t);
  const cur=document.getElementById('tcur');
  if(cur)cur.style.left=((ANIM.time%tot)/tot*100).toFixed(1)+'%';
  const lab=document.getElementById('animlab');
  if(lab){const l=ex.lab;lab.textContent=ex.static?'Hold stillingen. Pust rolig.':[l[0]+' → '+l[1],'Pause · '+l[1],l[1]+' → '+l[0],'Pause · '+l[0]][p.seg]}
  ANIM.raf=requestAnimationFrame(tick);
}
function stopAnim(){cancelAnimationFrame(ANIM.raf);ANIM.raf=0}
function animPlay(){ANIM.playing=!ANIM.playing;const b=document.getElementById('playbtn');if(b)b.textContent=ANIM.playing?'Pause':'Spill av'}
function animTo(i){ANIM.playing=false;const T=sched(ANIM.key);ANIM.time=i?T[0]+.01:0;const b=document.getElementById('playbtn');if(b)b.textContent='Spill av'}

function fracN(n){const w=Math.floor(n+1e-9),h=n-w;if(Math.abs(h)<.13)return String(w);if(Math.abs(h-.5)<.13)return (w?w:'')+'½';
  if(Math.abs(h-.25)<.13)return (w?w:'')+'¼';if(Math.abs(h-.75)<.13)return (w?w:'')+'¾';return String(Math.round(n))}
function measure(id,g){
  const i=ING[id];g=Math.round(g);
  if(id==='krydder')return 'etter smak';

  const n=g/i[7],u=UNIT[i[6]],lab=n>1.2?u[1]:u[0];

  return `${g} g (ca. ${fracN(Math.round(n*2)/2)} ${lab})`;
}

function trainWindow(p){
  if(p.k==='lang')return 'lang';
  if(['styrke','løp','kval','rolig'].includes(p.k)&&!p.opt)return S.profile.trainTime||'kveld';
  return 'hvile';
}
function dayLevel(k,p){const def=weekNo(k)<=DEFICIT_TO;return p.k==='lang'?(def?1:2):(def?0:1)}
function recMacro(r,lvl){return macro(r.ing.concat(lvl>=1?r.p1:[],lvl>=2?r.p2:[]))}
function recItems(r,lvl){return {base:r.ing,p1:lvl>=1?r.p1:[],p2:lvl>=2?r.p2:[]}}
function optsFor(slot){return RECIPES.filter(r=>SLOTOPT[slot].includes(r.slot))}
function dayNo(k){return Math.floor((parse(k)-parse('2026-01-01'))/864e5)}
function slotsFor(k){
  const p=effPlan(k),win=trainWindow(p),tpl=TEMPL[win];
  const d=S.days[k]||{},pick=d.pick||{},used=new Set();
  const out=[];
  tpl.forEach(([time,slot],i)=>{
    if(slot==='T'){out.push({i,time,slot:'T'});return}
    const opts=optsFor(slot);
    let r=RECIPES.find(x=>x.id===pick[i]);
    if(!r){
      let n=(dayNo(k)*2+i*3)%opts.length;
      for(let c=0;c<opts.length;c++){const cand=opts[(n+c)%opts.length];if(!used.has(cand.id)){r=cand;break}}
    }
    used.add(r.id);
    out.push({i,time,slot,r});
  });
  return out;
}
function dayMacros(k){
  const p=effPlan(k),lvl=dayLevel(k,p),d=S.days[k]||{},ate=d.ate||{};
  const tot={k:0,p:0,c:0,f:0},eaten={k:0,p:0,c:0,f:0};
  for(const s of slotsFor(k)){if(!s.r)continue;const m=recMacro(s.r,lvl);for(const x in tot){tot[x]+=m[x];if(ate[s.i])eaten[x]+=m[x]}}
  return {tot,eaten,lvl};
}
function levelName(l){return ['Basisdag','Mer-dag','Stor dag'][l]}
function ingList(r,lvl){
  const t=recItems(r,lvl),L=(a)=>a.filter(x=>x[0]!=='krydder').map(([id,g])=>`<li>${ING[id][0]}: <b>${measure(id,g)}</b></li>`).join('');
  let h=`<ul>${L(t.base)}</ul>`;
  const extra=t.p1.concat(t.p2);
  if(extra.length)h+=`<div class="sub" style="margin-top:6px">Tillegg i dag (${levelName(lvl).toLowerCase()}):</div><ul>${L(extra)}</ul>`;
  const kr=r.ing.find(x=>x[0]==='krydder');if(kr)h+=`<div class="sub">+ krydder, salt, pepper og buljong etter smak</div>`;
  return h;
}

      ${edit&&d.openSwap===s.i?`<div class="swap">${optsFor(s.slot).map(o=>{const mm=recMacro(o,lvl);return `<div class="dayrow" onclick="pickRecipe(${s.i},'${o.id}')"><span>${o.id===s.r.id?'✓ ':''}${o.n}</span><span class="sub">${Math.round(mm.k)} kcal · ${Math.round(mm.p)} g P</span></div>`}).join('')}</div>`:''}
      </div></div>`;
  }
  return h;
}

/* =======================================================================
   EGENTEST (kvalitetssikring) – kjøres fra Data-fanen
   ======================================================================= */
function selfTest(){
  const res=[],ok=(c,t)=>res.push([!!c,t]);
  const ban=/fisk|laks|tunfisk|tomat|squash|zucchini|ketchup|sopp|champignon|sjampinjong|kantarell|hummus|tofu|cashew|soya|linser|parmesan/i;
  // 1. oppskrifter
  let bad=[];for(const r of RECIPES){
    for(const [id] of r.ing.concat(r.p1,r.p2))if(!ING[id])bad.push(r.id+':'+id);
    if(ban.test((r.n+' '+r.steg.join(' ')+' '+r.tips).replace(/tomatfri|uten tomat|uten ketchup|i stedet for ketchup/gi,'')))bad.push(r.id+':forbudt ord');
    for(const [id] of r.ing.concat(r.p1,r.p2))if(ban.test(ING[id]?ING[id][0]:''))bad.push(r.id+':forbudt ingrediens');
  }
  ok(!bad.length,'Oppskrifter: ingredienser finnes, ingen fisk/tomat/squash/sopp og ingen uvanlige varer '+(bad.length?JSON.stringify(bad):'('+RECIPES.length+' oppskrifter)'));
  // 1b. enkelhet: maks 8 ingredienser og tid
  const complex=RECIPES.filter(r=>r.ing.filter(x=>x[0]!=='krydder').length>8||r.min>(r.slot==='middag'?35:15)).map(r=>r.id);
  ok(!complex.length,'Alle oppskrifter er enkle: maks 8 ingredienser, lunsj/frokost under 15 min '+complex.join(','));
  // 2. alle slots har minst 3 alternativer
  const few=Object.keys(SLOTOPT).filter(s=>optsFor(s).length<3);
  ok(!few.length,'Hvert måltid har minst 3 alternativer '+few.join(','));
  // 3. dagsummer per nivå
  const bounds={0:[2150,2650],1:[2550,3050],2:[2850,3400]};
  let off=[];
  for(let w=1;w<=28;w++){for(let dd=0;dd<7;dd++){
    const k=addDays(S.profile.start,(w-1)*7+dd),p=effPlan(k),m=dayMacros(k);
    if(!m.tot.p)continue;
    const b=bounds[m.lvl];
    if(m.tot.k<b[0]||m.tot.k>b[1])off.push(k+' '+Math.round(m.tot.k)+' kcal (nivå '+m.lvl+')');
    if(m.tot.p<150)off.push(k+' protein '+Math.round(m.tot.p));
  }}
  ok(!off.length,'Alle 28 uker: kcal innen nivåets ramme og protein ≥ 150 g '+(off.length?off.slice(0,4).join('; '):''));
  // 4. plan vs. uke vs. i dag vs. plan-fane
  let mis=[];
  for(let w=1;w<=29;w++)for(let dd=0;dd<7;dd++){
    const k=addDays(S.profile.start,(w-1)*7+dd),a=effPlan(k).t,b=weekDays(k).map(x=>effPlan(x).t)[dow(k)];
    if(a!==b)mis.push(k);
    if(weekNo(k)!==w)mis.push('weekNo '+k);
  }
  ok(!mis.length,'Samme økt vises i I dag, Uke og Plan for alle datoer '+(mis.length?mis.slice(0,3).join(','):''));
  // 5. Styrke og løp per uke
  const cnt=[];for(let w=9;w<=27;w++){const ds=weekDays(addDays(S.profile.start,(w-1)*7));
    const s=ds.filter(k=>planFor(k).k==='styrke').length,l=ds.filter(k=>['kval','lang'].includes(planFor(k).k)).length;
    if(s!==3||l!==2)cnt.push(w)}
  ok(!cnt.length,'Uke 9–27 har 3 styrkeøkter og 2 løpeøkter '+cnt.join(','));
  // 5b. logging
  const tk='2026-10-10';S.days[tk]={log:[{k:100,p:10,c:5,f:2}],ate:{}};
  const iv=intake(tk);delete S.days[tk];
  const e=macro([['egg',159]]),b=macro([['brod',70]]);
  const e2=macro([['egg',168]]),b2=macro([['brod',80]]);
  ok(Math.abs(iv.p-10)<.01&&Math.abs(iv.k-100)<.01&&Math.abs(e2.p-21.7)<.1&&Math.round(b2.k)===191,'Matloggeren regner riktig (3 egg = 21,7 g protein, 2 skiver brød = 191 kcal)');
  // 5c. matbasen: energi må stemme med makroene (4/4/9 kcal per g, alkohol unntatt)
  const odd=Object.entries(ING).filter(([id,v])=>!['krydder','ol','vin','kaffemelk','brus','juice'].includes(id)&&v[1]>20).filter(([id,v])=>{const est=4*v[2]+4*v[3]+9*v[4];return Math.abs(v[1]-est)>Math.max(30,.22*v[1])}).map(([id,v])=>v[0]+' ('+v[1]+' vs '+Math.round(4*v[2]+4*v[3]+9*v[4])+')');
  ok(!odd.length,'Matbasen: kcal stemmer med protein/karbo/fett for alle matvarer '+odd.join('; '));
  // 6. bibliotek
  const miss=Object.keys(LIB).filter(x=>!RIG[x]);let sess=[];
  for(const [sk,list] of Object.entries(EX))for(const e of list)for(const x of e.keys)if(!LIB[x])sess.push(sk+':'+x);
  ok(!miss.length&&!sess.length,'Alle øvelser i øktene har teknikk og animasjon '+miss.concat(sess).join(','));
  return res;
}
function runTest(){
  const r=selfTest();

  stopAnim();
  mm.innerHTML=`<div class="mbox"><div class="mhead"><b>Egentest</b><button class="g" onclick="closeEx()">Lukk ✕</button></div>

}

function lgMatches(){
  const q=LG.q.trim().toLowerCase();if(!q)return [];
  const out=[];
  for(const [id,v] of Object.entries(ING)){if(id==='krydder')continue;if(v[0].toLowerCase().includes(q))out.push({t:'i',id,n:v[0],sub:Math.round(v[1])+' kcal · '+v[2]+' g protein per 100 g'})}
  for(const r of RECIPES)if(r.n.toLowerCase().includes(q))out.push({t:'r',id:r.id,n:r.n,sub:'Oppskrift (hele måltidet)'});
  const rank=x=>(x.t==='i'?0:10)+(x.n.toLowerCase().startsWith(q)?0:1);
  out.sort((a,b)=>rank(a)-rank(b));
  return out.filter(x=>x.t==='i').slice(0,7).concat(out.filter(x=>x.t==='r').slice(0,3));
}

const KEY='treningsdagbok.v1';
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days){r.weeks=r.weeks||{};r.customFoods=r.customFoods||[];r.customIng=r.customIng||[];r.customIng.forEach(c=>{ING[c.id]=[c.n,c.k,c.p,c.c,c.f,'Egne',c.u||null,c.ug||null]});r.profile=Object.assign({height:175,startWeight:90,goalLow:80,goalHigh:83,start:START,race:RACE},r.profile);return r}}catch(e){}
  return {profile:{height:175,startWeight:90,goalLow:80,goalHigh:83,start:START,race:RACE},days:{},weeks:{},customFoods:[],customIng:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Kunne ikke lagre i nettleseren – bruk Eksporter under Data.')}}
const two=n=>String(n).padStart(2,'0');
const D=(d=new Date())=>d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate());
const parse=k=>new Date(k+'T00:00:00Z');
const dow=k=>parse(k).getUTCDay();
const addDays=(k,n)=>{const d=parse(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const day=k=>S.days[k]||(S.days[k]={});
const $=s=>document.querySelector(s);
const NO=['søn','man','tir','ons','tor','fre','lør'];
const fmt=k=>k.slice(8)+'.'+k.slice(5,7);
let tab='idag',cur=D();

/* =======================================================================
   3. HJELPERE
   ======================================================================= */
function weekNo(k){return Math.floor((parse(k)-parse(S.profile.start))/6048e5)+1}
function daysTo(k){return Math.round((parse(k)-parse(D()))/864e5)}
function weights(){return Object.entries(S.days).filter(([k,v])=>v.weight).map(([k,v])=>[k,+v.weight]).sort()}
function trend(){const w=weights();return w.map(([k])=>{const s=w.filter(([k2])=>k2<=k&&(parse(k)-parse(k2))/864e5<7);return [k,s.reduce((a,b)=>a+b[1],0)/s.length]})}
function refWeight(){const t=trend();return t.length?t[t.length-1][1]:+S.profile.startWeight}
function intake(k){
  const d=S.days[k]||{},m={k:0,p:0,c:0,f:0},e=dayMacros(k).eaten;
  for(const x in m)m[x]+=e[x];
  for(const l of (d.log||[])){m.k+=l.k;m.p+=l.p;m.c+=l.c;m.f+=l.f}
  for(const l of (d.meals||[]))m.p+=(+l.p||0);
  return m;
}
function protein(k){return Math.round(intake(k).p)}
function proteinTarget(){return Math.round(refWeight()*1.8/5)*5}
function allFoods(){return FOODS.concat(S.customFoods||[])}
function weekDays(k){const s=addDays(k,-dow(k));return [...Array(7)].map((_,i)=>addDays(s,i))}
function restRun(k){let n=0,d=k;for(;n<7;){d=addDays(d,-1);if(d<S.profile.start)return 0;if((S.days[d]||{}).done)break;n++}return n}
function set(f,v,sub){const d=day(cur);if(sub){d[sub]=d[sub]||{};d[sub][f]=v}else d[f]=v;save()}
function travelSess(k,p){return (weekDays(k).indexOf(k)%2===0)?'R1':'R2'}
function effPlan(k){ // tar hensyn til reisedag
  const p=planFor(k),d=S.days[k]||{};
  if(d.travel&&(p.k==='styrke'||p.k==='bonus')) return Object.assign({},p,{s:travelSess(k,p),t:SESS[travelSess(k,p)].t,d:'Reisedag: '+SESS[travelSess(k,p)].sub,min:30});
  if(d.travel&&(p.k==='løp'||p.k==='rolig'||p.k==='kval'||p.k==='lang')) return Object.assign({},p,{t:p.t+' (reise)',d:'Reisedag: 20–30 min jogg/gange på tid, etter følelse. Teller som gjennomført.',min:25});
  return p;
}

function chips(keys){return keys.map(k=>`<span class="chip" onclick="openEx('${k}',${JSON.stringify(keys).replace(/"/g,'&quot;')})">▶ ${LIB[k].n}</span>`).join('')}
function exList(key){return (EX[key]||[]).map(e=>`<div class="ex"><div class="nm">${e.n} <span class="pill">${e.s}</span></div><div>${chips(e.keys)}</div></div>`).join('')}

function vIdag(){

function lastWaist(ds){const v=ds.map(k=>(S.days[k]||{}).waist).filter(Boolean);return v.length?v[v.length-1]+' cm':'–'}

function addSet(i){
  const d=day(cur),exs=effPlan(cur).s?EX[effPlan(cur).s]:[];

function intakeCard(k){
  const i=intake(k),pt=proteinTarget(),en=energy(k,effPlan(k)),left=Math.max(0,pt-i.p);
  return `<div class="card"><h2>Faktisk spist hittil i dag</h2>

      <div><div class="big">${Math.round(i.f)}</div><div class="sub">g fett</div></div>
      <div><div class="big">${Math.round(i.k)}</div><div class="sub">kcal (mål ${en.lo}–${en.hi})</div></div></div>
    <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,i.p/pt*100)}%"></i></div>
    <div class="sub" style="margin-top:6px">${left>0?`Mangler ca. ${Math.round(left)} g protein og ${Math.max(0,Math.round(en.lo-i.k))} kcal for å nå dagens minimum.`:'Proteinmålet er nådd. 🎉'}</div></div>`;
}
function vMat(){
  const d=day(cur),meals=d.meals||[],rules=d.rules||{},supp=d.supp||{},p=effPlan(cur);
  const pt=proteinTarget(),pr=protein(cur),en=energy(cur,p),dm=dayMacros(cur);
  const inRange=dm.tot.k>=en.lo-150&&dm.tot.k<=en.hi+150;
  return dateBar()+weekStrip(cur)+`
  <div class="card"><h2>${NO[dow(cur)]} ${fmt(cur)} · ${p.t} · ${levelName(dm.lvl)}</h2>
    <div class="row">
      <div><div class="big">${Math.round(dm.tot.k)}</div><div class="sub">kcal planlagt (mål ${en.lo}–${en.hi}) ${inRange?'✓':''}</div></div>
      <div><div class="big">${Math.round(dm.tot.p)}</div><div class="sub">g protein (mål ≥ ${pt})</div></div>
      <div><div class="big">${Math.round(dm.tot.c)}</div><div class="sub">g karbo</div></div>
      <div><div class="big">${Math.round(dm.tot.f)}</div><div class="sub">g fett</div></div>
    </div>
    <div class="sub" style="margin-top:6px">${en.def?'Underskuddsfase (til uke '+DEFICIT_TO+')':'Vedlikehold'}. Mengdene i oppskriftene er tilpasset dagens nivå.</div></div>
  ${intakeCard(cur)}
  <div class="card"><h2>Hva spiser jeg når? (trykk «Bytt» for alternativer)</h2>
    <div class="row" style="margin-bottom:6px"><div class="sub">Trener</div>
      <select style="flex:0 0 auto;width:auto;min-width:200px" onchange="setTrainTime(this.value)">${Object.entries(TRAINTIME).map(([k,l])=>`<option value="${k}" ${(S.profile.trainTime||'kveld')===k?'selected':''}>${l}</option>`).join('')}</select></div>
    ${mealTimeline(cur,true)}</div>
  ${logCard(cur)}
  <div class="card"><h2>Handleliste og oppskrifter</h2>
    <button class="b" onclick="shoppingList(cur)">Handleliste for uke ${weekNo(cur)}</button></div>
  <div class="card"><h2>Dagens regler</h2>
    ${RULES.map((t,i)=>`<label class="chk"><input type="checkbox" ${rules[i]?'checked':''} onchange="setIn('rules',${i},this.checked)"><span style="color:var(--ink);font-size:16px">${t}</span></label>`).join('')}</div>
  <div class="card"><h2>Tilskudd</h2>
    ${SUPPS.map(([t,s],i)=>`<label class="chk"><input type="checkbox" ${supp[i]?'checked':''} onchange="setIn('supp',${i},this.checked)"><span style="color:var(--ink);font-size:16px">${t} <span class="sub">${s}</span></span></label>`).join('')}</div>
  <div class="card"><h2>Når du er på reise</h2>${TRAVEL_RULES.map(t=>`<div class="sm" style="margin:4px 0">• ${t}</div>`).join('')}</div>`;
}
function setIn(g,i,v){const d=day(cur);d[g]=d[g]||{};d[g][i]=v;save();render()}
function addFood(){const i=$('#food').value;if(i==='')return;const f=allFoods()[i];logMeal(f[0],f[1])}
function logMeal(n,p){const d=day(cur);(d.meals=d.meals||[]).push({n,p});save();render()}
function addCustom(){const n=$('#cn').value.trim(),p=+$('#cp').value;if(!n||!p)return;
  if(!S.customFoods.find(f=>f[0]==n))S.customFoods.push([n,p]);logMeal(n,p)}
function delMeal(i){day(cur).meals.splice(i,1);save();render()}

let exFilter='',exGroup='';
function vOvelser(){
  const groups=[...new Set(Object.values(LIB).map(e=>e.g))];
  const list=Object.entries(LIB).filter(([k,e])=>(!exGroup||e.g===exGroup)&&(!exFilter||e.n.toLowerCase().includes(exFilter.toLowerCase())));
  return `<div class="card"><h2>Øvelsesbibliotek (${Object.keys(LIB).length})</h2>
    <input id="exq" placeholder="Søk øvelse…" value="${exFilter}" oninput="exFilter=this.value;vOvelserList()">
    <div style="margin-top:8px"><span class="chip ${!exGroup?'sel':''}" onclick="exGroup='';render()">Alle</span>${groups.map(g=>`<span class="chip ${exGroup===g?'sel':''}" onclick="exGroup='${g}';render()">${g}</span>`).join('')}</div></div>
    <div class="card" id="exlist">${exRows(list)}</div>`;
}
function exRows(list){return list.map(([k,e])=>`<div class="dayrow" onclick="openEx('${k}')"><span><b>${e.n}</b><br><span class="sub">${e.m}</span></span><span class="pill">${e.g}</span></div>`).join('')||'<div class="sub">Ingen treff</div>'}
function vOvelserList(){const l=Object.entries(LIB).filter(([k,e])=>(!exGroup||e.g===exGroup)&&(!exFilter||e.n.toLowerCase().includes(exFilter.toLowerCase())));$('#exlist').innerHTML=exRows(l)}
function vFremgang(){
  const t=trend(),last=t.length?t[t.length-1][1]:null;
  const all=Object.entries(S.days),done=all.filter(([k,v])=>v.done).length;
  const wkDone=weekDays(D()).filter(k=>(S.days[k]||{}).done).length;
  const km=all.reduce((a,[k,v])=>a+(+(v.run||{}).km||0),0);
  const waist=all.filter(([k,v])=>v.waist).sort().map(([k,v])=>fmt(k)+': '+v.waist);
  const bf=all.filter(([k,v])=>v.bf).sort().map(([k,v])=>fmt(k)+': '+v.bf+' %');
  const d=day(cur);
  return `<div class="card"><h2>Vekt (7-dagers snitt)</h2>
    <div class="big">${last?last.toFixed(1)+' kg':'–'}</div>
    <div class="sub">Start ${S.profile.startWeight} kg · mål ${S.profile.goalLow}–${S.profile.goalHigh} kg – vekt er sekundært, følg midje, styrke og bilder</div>
    <svg id="chart" viewBox="0 0 400 160"></svg></div>
  <div class="card"><h2>Konsistens</h2>
    <div class="row"><div><div class="big">${wkDone}</div><div class="sub">økter denne uka</div></div>
    <div><div class="big">${done}</div><div class="sub">totalt</div></div>
    <div><div class="big">${km.toFixed(0)}</div><div class="sub">km løpt</div></div></div></div>
  <div class="card"><h2>Midjemål og kroppsfett (${fmt(cur)})</h2>
    <div class="row"><div><label>Midje (cm, ved navle)</label><input type="number" step="0.5" value="${d.waist||''}" onchange="set('waist',this.value)"></div>
    <div><label>Kroppsfett (%)</label><input type="number" step="0.1" value="${d.bf||''}" onchange="set('bf',this.value)"></div></div>
    <div class="sub" style="margin-top:6px">Midje: ${waist.join(' · ')||'ingen ennå – mål ukentlig'}<br>Kroppsfett: ${bf.join(' · ')||'mål ved start, uke 13 og uke 26'}<br>Helsemål: midje under halve høyden (≈ 87 cm).</div></div>`;
}
function drawChart(){
  const t=trend(),el=$('#chart');
  if(t.length<2){el.innerHTML='<text x="10" y="80" fill="currentColor" font-size="12">Logg vekt noen dager for å se kurven.</text>';return}
  const ys=t.map(x=>x[1]).concat([+S.profile.goalHigh,+S.profile.goalLow]),mn=Math.min(...ys)-1,mx=Math.max(...ys)+1;
  const t0=parse(t[0][0]),sp=Math.max(864e5,parse(t[t.length-1][0])-t0);
  const X=k=>20+(parse(k)-t0)/sp*370,Y=v=>150-(v-mn)/(mx-mn)*140;
  el.innerHTML=`<rect x="20" y="${Y(S.profile.goalHigh)}" width="370" height="${Y(S.profile.goalLow)-Y(S.profile.goalHigh)}" fill="var(--acc)" opacity=".15"/>
   <polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${t.map(([k,v])=>X(k)+','+Y(v)).join(' ')}"/>
   <text x="22" y="${Y(S.profile.goalHigh)-3}" font-size="9" fill="var(--mut)">målsone</text>`;
}

function vPlan(){
  const w0=weekNo(D());
  return `<div class="card"><h2>Faser</h2>${PHASES.map(p=>`<div style="margin:6px 0"><b>${p.name}</b> <span class="pill">uke ${p.from}–${p.to} · ${p.days} dager</span><div class="sm sub">${p.text}</div></div>`).join('')}
  <div class="sub" style="margin-top:6px">Kosthold: underskudd uke 1–${DEFICIT_TO} (ca. 0,4–0,5 kg/uke), vedlikehold uke ${DEFICIT_TO+1}–28. Trykk på en uke for å se hver dag.</div></div>
  ${[...Array(WEEKS)].map((_,i)=>{const w=i+1,s=addDays(S.profile.start,i*7),ph=phaseOf(w);
    const ds=[...Array(7)].map((_,j)=>addDays(s,j));
    return `<details class="card wk ${w===w0?'hl':''}" ${w===w0?'open':''}><summary><b>Uke ${w}</b> · ${fmt(ds[0])}–${fmt(ds[6])} · ${ph.name}${w===w0?' · <span class="pill a">nå</span>':''}</summary>
      ${ds.map(k=>{const p=planFor(k);return `<div class="dayrow ${k===D()?'today':''}" onclick="cur='${k}';go('idag')"><span>${NO[dow(k)]} ${fmt(k)}</span><span style="text-align:right"><b>${p.t||'Fri'}</b>${p.opt?' <span class="sub">(valgfri)</span>':''}<br><span class="sub">${(p.d||'').split(' · ')[0].slice(0,90)}</span></span></div>`}).join('')}
    </details>`}).join('')}`;
}
function vData(){
  const p=S.profile;
  return `<div class="card"><h2>Innstillinger</h2>
    <div class="row">
      <div><label>Startvekt</label><input type="number" value="${p.startWeight}" onchange="S.profile.startWeight=+this.value;save()"></div>
      <div><label>Mål fra (kg)</label><input type="number" value="${p.goalLow}" onchange="S.profile.goalLow=+this.value;save()"></div>
      <div><label>Mål til (kg)</label><input type="number" value="${p.goalHigh}" onchange="S.profile.goalHigh=+this.value;save()"></div>
    </div><div class="sub" style="margin-top:8px">Løpsdato og startdato er låst til planen (Madrid, søndag 25.4.2027). Er løpet en annen dag, si fra så justeres planen.</div></div>
  <div class="card"><h2>Sikkerhetskopi</h2>
    <div class="sub">Data ligger kun i denne nettleseren på denne enheten. Eksporter jevnlig (f.eks. hver søndag).</div>
    <div class="row" style="margin-top:8px"><button class="b" onclick="exp()">Eksporter JSON</button><button class="g" onclick="$('#imp').click()">Importer</button></div>
    <input id="imp" type="file" accept=".json" class="hide" onchange="imp(this.files[0])"></div>
  <div class="card"><h2>Kilder til næringsverdier</h2><div class="sub">Næringsverdier og porsjonsvekter er hentet fra <b>Matvaretabellen.no</b> (Mattilsynet, 2 121 matvarer) og kontrollert 11.10.2026. Unntak: skyr naturell (Tine-pakning, finnes ikke som naturell i tabellen), myseprotein og proteinbar (produsent, sjekk pakken), kyllingpålegg (satt lik kalkunfilet), og vekt per stk for poteter og løk er veiledende. Egne matvarer legger du inn selv.</div></div>
  <div class="card"><h2>Kvalitetssjekk</h2><div class="sub">Kontrollerer plan, måltider, kcal/protein per dag og at alle øvelser har teknikk.</div><button class="g" style="margin-top:8px" onclick="runTest()">Kjør egentest</button></div>
  <div class="card"><h2>Nullstill</h2><button class="g" onclick="if(confirm('Slette ALL data?')){localStorage.removeItem(KEY);S=load();render()}">Slett alle data</button></div>
  <div class="card"><h2>Om</h2><div class="sub">Programmet bygger på forskningsnotatene i mappen «forskning». Dette er ikke medisinsk rådgivning – ved smerte, brystsmerter eller uvanlig tungpust: stopp og kontakt lege.</div></div>`;
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='treningsdagbok-'+D()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.days)throw 0;S=o;save();S=load();render()}catch(e){alert('Ugyldig fil')}};r.readAsText(f)}

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
